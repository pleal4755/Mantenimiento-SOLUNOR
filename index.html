  SISTEMA DE GESTION DE MANTENIMIENTO - SOLUNOR (una operacion)
  Copia del sistema de BIOSKA / Nordic (base: Planta PQ). Programa independiente.

  Cambios de esta version:
   - Una sola planta (configurable).
   - Sin "Ruta de implementacion" (es recomendacion del asesor, no parte del sistema).
   - Acceso por usuario: Administrador o Mecanico. El mecanico ve SOLO sus OT,
     las ejecuta y cierra. El Administrador puede reasignar OT.
   - Modulo de Plan Preventivo (PMR) con generacion automatica de OT por
     frecuencia de calendario u horometro.
   - Reporte de hallazgos de inspeccion directo desde el mecanico (resuelto en
     sitio -> OT cerrada; o requiere programacion -> Solicitud).

<script>
/* ============ STORAGE (compartido) ============ */
const MEM={};const SHARED=true;
/* Detecta el mejor almacenamiento disponible:
   - 'artifact': window.storage (vista previa del chat)
   - 'local'   : localStorage (cuando corre en tu propio sitio, p.ej. GitHub Pages)
   - 'mem'     : solo memoria (último recurso) */
const STORE=(()=>{
  let mode='mem';
  try{ if(typeof window!=='undefined' && window.storage && window.storage.get) mode='artifact'; }catch(e){}
  if(mode==='mem'){ try{ const k='__bioska_test';localStorage.setItem(k,'1');localStorage.removeItem(k);mode='local'; }catch(e){} }
  return {mode};
})();
async function sGet(k){
  try{
    if(STORE.mode==='artifact'){const r=await window.storage.get(k,SHARED);return r?JSON.parse(r.value):null;}
    if(STORE.mode==='local'){const v=localStorage.getItem(k);return v?JSON.parse(v):null;}
  }catch(e){}
  return (k in MEM)?MEM[k]:null;
}
async function sSet(k,v){
  MEM[k]=v;
  try{
    if(STORE.mode==='artifact'){await window.storage.set(k,JSON.stringify(v),SHARED);return;}
    if(STORE.mode==='local'){localStorage.setItem(k,JSON.stringify(v));return;}
  }catch(e){}
}
function updateStoreState(){
  const el=document.getElementById('storeState');if(!el)return;
  if(isBackend()) el.innerHTML='🟢 Conectado: Google Sheets';
  else if(STORE.mode==='local') el.textContent='Datos locales (este navegador)';
  else if(STORE.mode==='artifact') el.textContent='Datos compartidos (demo)';
  else el.textContent='Solo esta sesión';
}

/* ============ BACKEND GOOGLE SHEETS (Apps Script) — SOLUNOR ============ */
/* >>> PEGA AQUÍ, UNA SOLA VEZ, LA URL /exec DEL APPS SCRIPT DE ESTA PLANTA <<<
   Ejemplo:
   const BACKEND_URL_FIJA='https://script.google.com/macros/s/AKfy....../exec';
   Al quedar escrita aquí, TODAS las máquinas que abran este archivo se conectan
   solas a Google Sheets: el usuario final no configura nada.
   Si se deja vacío (''), el sistema funciona en modo local de demostración. */
const BACKEND_URL_FIJA='https://script.google.com/macros/s/AKfycbydVU6E2Pfa1V_S1RWWOtCouOFSFtBpL_JKEIB3RTYI67HXmRSKXRwYisjlWg0RP7fu/exec';

const API={url:'',token:'',role:'',mecId:''};
function isBackend(){return !!API.url;}
async function apiCall(action,payload){
  const res=await fetch(API.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(Object.assign({action,token:API.token},payload||{}))});
  const data=await res.json();
  if(!data.ok)throw new Error(data.error||'Error del servidor');
  return data;
}
async function loadBackendUrl(){ API.url=BACKEND_URL_FIJA||''; }

/* ============ ESTADO ============ */
const DB={config:{},activos:[],mecanicos:[],solicitudes:[],ots:[],pmrs:[],componentes:[],reemplazos:[]};
let SESSION={role:null,mecId:null};

/* ============ PMR / VENCIMIENTOS ============ */
function pmrEstado(p){
  if(p.otActiva && DB.ots.find(o=>o.id===p.otActiva&&o.status!=='Terminada'&&o.status!=='Cancelada')) return {st:'en-ot',dias:null};
  if(p.tipo==='Calendario'){const dias=Math.round((new Date(p.prox+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);
    return {st:dias<0?'vencida':(dias<=7?'pronto':'ok'),dias};}
  else {const falta=(+p.freqHoras||0)-(+p.horasAcum||0);
    return {st:falta<=0?'vencida':(falta<=(p.freqHoras*0.15)?'pronto':'ok'),dias:null,falta};}
}

/* ============ KPIs ============ */
function computeKPIs(){
  const ots=DB.ots;const done=ots.filter(o=>o.status==='Terminada');
  const sum=(a,f)=>a.reduce((s,o)=>s+(+f(o)||0),0);
  const hEstPlan=sum(ots.filter(o=>o.planificada),o=>o.hrsEst);
  const hEstPlanDone=sum(done.filter(o=>o.planificada),o=>o.hrsEst);
  const cumpl=hEstPlan?hEstPlanDone/hEstPlan*100:0;
  const hReal=sum(done,o=>o.hrsReal);
  const hPrev=sum(done.filter(o=>o.clase==='Preventivo (PMR)'),o=>o.hrsReal);
  const hNoPlan=sum(done.filter(o=>!o.planificada),o=>o.hrsReal);
  const pmrK=hReal?hPrev/hReal*100:0;const noplan=hReal?hNoPlan/hReal*100:0;
  const atras=ots.filter(o=>o.status!=='Terminada'&&o.status!=='Cancelada'&&o.fechaProg&&o.fechaProg<today());
  const hAtras=sum(atras,o=>o.hrsEst);
  const HOR=720;const fallas=done.filter(o=>o.clase==='Correctivo'||o.clase==='Emergencia');
  const downAll=sum(done,o=>o.tiempoMuerto);const downFail=sum(fallas,o=>o.tiempoMuerto);
  const tot=HOR*Math.max(DB.activos.length,1);
  const disp=tot?((tot-downAll)/tot*100):100;const conf=tot?((tot-downFail)/tot*100):100;
  const nF=fallas.length;const mtbf=nF?((tot-downFail)/nF):0;const mttr=nF?(downFail/nF):0;
  const costo=sum(done,o=>(+o.costoMO||0)+(+o.costoRep||0)+(+o.costoMisc||0));
  return {cumpl,pmr:pmrK,noplan,hAtras,nAtras:atras.length,disp,conf,mtbf,mttr,costo,totalOT:ots.length,done:done.length,nF};
}

/* ============ SOLICITUDES ============ */
let solFilter='Todas';

function viewSolicitudes(){
  return `<div class="toolbar">

function filterSolicitudes(){const el=$('#solBody');if(el)el.innerHTML=renderSolRows(solFilteredList());}
function renderSolRows(list){

    <td class="code">${esc(s.num)}</td><td class="nowrap">${fmtDate(s.fecha)}</td>

    <td class="mini">${esc(s.origen||'Manual')}</td><td>${solBadge(s.status)}</td>
    <td class="rt nowrap">${s.status==='Pendiente'?`<button class="btn sm primary" onclick="convertSol('${s.id}')">→ Generar OT</button>`:''}
    <button class="btn sm ghost" onclick="viewSol('${s.id}')">Ver</button></td></tr>`).join('');
}
function solBadge(s){const m={'Pendiente':'st-pend','Convertida':'st-term','Rechazada':'st-canc'};return `<span class="st ${m[s]||'st-pend'}">${s}</span>`;}
function openSolForm(){
  setModal('Nueva Solicitud de Mantenimiento / Reporte de Falla',`
    <div class="note" style="margin-bottom:14px"><span class="ni">ℹ️</span> Indique únicamente <b>qué está mal</b>. El técnico decidirá qué hacer tras verificar el equipo.</div>

      <div class="field"><label>Fecha</label><input type="date" id="f_fecha" value="${today()}"></div>
      <div class="field"><label>Equipo / Área</label><input id="f_equipo" placeholder="Ej. Plato granulador"></div>
      <div class="field"><label>Tipo de requerimiento</label><select id="f_tipo">${TIPOS.map(t=>`<option>${t}</option>`).join('')}</select></div>
    </div>
    <div class="fgrid fg2" style="margin-top:13px">
      <div class="field"><label>Disponible para intervención</label><input type="date" id="f_disp" value="${today()}"><div class="hint">Compromiso del solicitante.</div></div>
      <div class="field"><label>Prioridad</label><select id="f_prio">${Object.entries(PRIORIDADES).map(([k,v])=>`<option value="${k}">${k}. ${v}</option>`).join('')}</select></div>
    </div>

async function saveSol(){
  const s={id:uid('s_'),num:nextSolNum(),fecha:$('#f_fecha').value,equipo:$('#f_equipo').value.trim()||'(sin nombre)',
    tipo:$('#f_tipo').value,disponible:$('#f_disp').value,prioridad:+$('#f_prio').value,desc:$('#f_desc').value.trim(),
    solicitante:$('#f_solic').value.trim(),recibe:$('#f_recibe').value.trim(),status:'Pendiente',origen:'Manual'};

function kv(k,v){return `<div class="field"><label>${k}</label><div style="font-size:14px;font-weight:600">${esc(v)}</div></div>`;}
function viewSol(id){
  const s=DB.solicitudes.find(x=>x.id===id);if(!s)return;
  setModal('Solicitud '+s.num,`<div class="fgrid fg2">
    ${kv('Fecha',fmtDate(s.fecha))}${kv('Equipo / Área',s.equipo)}${kv('Tipo',s.tipo)}${kv('Prioridad',PRIORIDADES[s.prioridad])}
    ${kv('Disponible',fmtDate(s.disponible))}${kv('Origen',s.origen||'Manual')}${kv('Solicitante',s.solicitante||'—')}${kv('Recibe',s.recibe||'—')}</div>
    <div class="field" style="margin-top:14px"><label>Descripción</label><div style="background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:11px;font-size:13px">${esc(s.desc)||'<span class="mini">Sin descripción</span>'}</div></div>
    <div class="field" style="margin-top:12px"><label>Estado</label>${solBadge(s.status)}</div>`,

     s.status==='Pendiente'?{t:'→ Generar OT',cls:'primary',fn:`closeModal();convertSol('${s.id}')`}:null,

async function rejectSol(id){const s=DB.solicitudes.find(x=>x.id===id);s.status='Rechazada';await save();closeModal();render();}
async function delSol(id){if(!guardAction())return;try{if(!confirm('¿Eliminar esta solicitud?'))return;DB.solicitudes=DB.solicitudes.filter(s=>s.id!==id);await save();closeModal();render();toast('Solicitud eliminada');}finally{releaseAction();}}
function convertSol(id){const s=DB.solicitudes.find(x=>x.id===id);if(s)openOtForm(null,s);}

/* ============ ORDENES DE TRABAJO ============ */
let otFilter='Activas';
let otUtFilter='',otActivoFilter='',otMecFilter='';
function otsFilteredList(){
  let list=DB.ots.slice();
  if(otFilter==='Activas')list=list.filter(o=>o.status!=='Terminada'&&o.status!=='Cancelada');
  else if(otFilter!=='Todas')list=list.filter(o=>o.status===otFilter);
  if(otUtFilter)list=list.filter(o=>activo(o.activo)?.ut===otUtFilter);
  if(otActivoFilter)list=list.filter(o=>o.activo===otActivoFilter);
  if(otMecFilter)list=list.filter(o=>otMecFilter==='__sin__'?!o.mecanico:o.mecanico===otMecFilter);
  list.sort((a,b)=>(b.num||'').localeCompare(a.num||''));
  return list;
}
function otUtChange(){otUtFilter=$('#ot_fUt').value;otActivoFilter='';render();}
function otActivoFilterChange(){otActivoFilter=$('#ot_fActivo').value;render();}
function otMecFilterChange(){otMecFilter=$('#ot_fMec').value;render();}
function clearOtFilters(){otUtFilter='';otActivoFilter='';otMecFilter='';render();}
function viewOts(){
  const utList=[...new Set(DB.activos.map(a=>a.ut).filter(Boolean))].sort();
  const utOpts=`<option value="">— Todas las ubicaciones —</option>`+utList.map(u=>`<option value="${esc(u)}" ${otUtFilter===u?'selected':''}>${esc(u)}</option>`).join('');
  const actOpts=`<option value="">— Todos los equipos —</option>`+DB.activos.filter(a=>!otUtFilter||a.ut===otUtFilter).map(a=>`<option value="${a.id}" ${otActivoFilter===a.id?'selected':''}>${a.codigo} — ${a.desc}</option>`).join('');
  const mecOpts=`<option value="">— Todos los mecánicos —</option><option value="__sin__" ${otMecFilter==='__sin__'?'selected':''}>— Sin asignar —</option>`+DB.mecanicos.map(m=>`<option value="${m.id}" ${otMecFilter===m.id?'selected':''}>${m.nombre}</option>`).join('');
  return `<div class="toolbar">
    <div class="seg">${['Activas','Todas','Pendiente','Asignada','En proceso','Terminada'].map(f=>`<button class="${otFilter===f?'on':''}" onclick="otFilter='${f}';render()">${f}</button>`).join('')}</div>
    <div class="search"><span class="si">🔎</span><input id="otSearch" placeholder="Buscar OT, equipo, mecánico…" oninput="filterOts()" value="${esc($('#otSearch')?.value||'')}"></div>
    <button class="btn primary" onclick="openOtForm()">+ Nueva OT</button></div>
  <div class="toolbar">
    <div class="field" style="flex:1;min-width:170px"><label>Ubicación técnica</label><select id="ot_fUt" onchange="otUtChange()">${utOpts}</select></div>
    <div class="field" style="flex:1;min-width:200px"><label>Equipo</label><select id="ot_fActivo" onchange="otActivoFilterChange()">${actOpts}</select></div>
    <div class="field" style="flex:1;min-width:180px"><label>Mecánico</label><select id="ot_fMec" onchange="otMecFilterChange()">${mecOpts}</select></div>
    ${(otUtFilter||otActivoFilter||otMecFilter)?'<button class="btn sm ghost" style="align-self:flex-end" onclick="clearOtFilters()">✕ Limpiar filtros</button>':''}
  </div>
    <div class="card"><div class="scrollx"><table class="tbl">
    <thead><tr><th># OT</th><th>Equipo</th><th>Clase</th><th>Prio</th><th>Programada</th><th>Asignada a</th><th>Hrs E/R</th><th>Comentarios</th><th>Estado</th><th></th></tr></thead>
    <tbody id="otsBody">${renderOtRows(otsFilteredList())}</tbody></table></div></div>`;
}
function filterOts(){const el=$('#otsBody');if(el)el.innerHTML=renderOtRows(otsFilteredList());updateBadges();}
function renderOtRows(list){
  const q=($('#otSearch')?.value||'').toLowerCase();
  const f=list.filter(o=>{const a=activo(o.activo);const m=mecanico(o.mecanico);
    return !q||((o.num+' '+(o.equipoTxt||'')+' '+(a?a.codigo+a.desc:'')+' '+(m?m.nombre:'')).toLowerCase().includes(q));});
  if(!f.length)return `<tr><td colspan="10" class="empty">Sin órdenes de trabajo.</td></tr>`;
  return f.map(o=>{const a=activo(o.activo);const m=mecanico(o.mecanico);
    const cmt=o.comentarios?esc(o.comentarios.length>140?o.comentarios.slice(0,140)+'…':o.comentarios):'<span class="mini">—</span>';
    return `<tr>
    <td class="code">${esc(o.num)}${a&&a.crit?` <span class="pill crit-${a.crit}">${a.crit}</span>`:''}${o.pmrId?' <span class="pill pcc">PMR</span>':''}</td>
    <td>${a?`<span class="code">${esc(a.codigo)}</span> ${esc(a.desc)}`:esc(o.equipoTxt||'—')}</td>
    <td class="nowrap">${esc(o.clase)}</td><td><span class="prio p${o.prioridad}">${o.prioridad}</span></td>
    <td class="nowrap mini">${fmtDate(o.fechaProg)}${o.fechaProg&&o.fechaProg<today()&&o.status!=='Terminada'&&o.status!=='Cancelada'?' <span style="color:var(--red)">⚠</span>':''}</td>
    <td>${m?`<span style="display:inline-flex;align-items:center;gap:7px"><span class="dot" style="background:${m.color}"></span>${esc(m.nombre)}</span>`:'<span class="mini">— sin asignar —</span>'}</td>
    <td class="mini nowrap">${(o.hrsEst||0)} / ${(o.hrsReal||0)}</td>
    <td class="mini" style="max-width:240px;white-space:normal">${cmt}</td>
    <td>${otBadge(o.status)}</td>
    <td class="rt nowrap"><button class="btn sm amber" onclick="assignOt('${o.id}')">${o.mecanico?'Reasignar':'Asignar'}</button>
    <button class="btn sm ghost" onclick="openOtForm('${o.id}')">Abrir</button></td></tr>`;}).join('');
}
function otBadge(s){const m={'Pendiente':'st-pend','Asignada':'st-asig','En proceso':'st-prog','Terminada':'st-term','Cancelada':'st-canc'};return `<span class="st ${m[s]||'st-pend'}">${s}</span>`;}

      <div class="field"><label>Prioridad</label><select id="o_prio">${Object.entries(PRIORIDADES).map(([k,v])=>`<option value="${k}" ${base.prioridad==k?'selected':''}>${k}. ${v}</option>`).join('')}</select></div>

function otActivoChange(){
  $('#o_ut').textContent=activo($('#o_activo').value)?.ut||'—';
  $('#o_compsWrap').innerHTML=otCompsChecklist($('#o_activo').value,OT_FORM_ID);

function otCompsChecklist(activoId,otId){
  const comps=DB.componentes.filter(c=>c.activo===activoId);
  if(!comps.length)return '<div class="mini">Este activo no tiene piezas registradas (Activos → Piezas).</div>';
  const already=otId?new Set(DB.reemplazos.filter(r=>r.otId===otId).map(r=>r.componenteId)):new Set();
  return comps.map(c=>`<label style="display:flex;align-items:center;gap:9px;text-transform:none;letter-spacing:0">
    <input type="checkbox" data-comp="${c.id}" ${already.has(c.id)?'checked':''}><span style="font-size:13.5px">${c.codigo?`<span class="code">${esc(c.codigo)}</span> `:''}${esc(c.nombre)}${(c.cantidad||1)>1?` <span class="mini">(x${c.cantidad})</span>`:''}${c.critico?' <span class="pill pcc">Crítica</span>':''}</span></label>`).join('');
}
function taskRow(t,i){return `<div class="fgrid" style="grid-template-columns:auto 1fr;gap:9px;margin-bottom:8px" data-task>

function syncReemplazos(otId,activoId){
  const wrap=$('#o_compsWrap');if(!wrap)return;

  const existing=new Set(DB.reemplazos.filter(r=>r.otId===otId).map(r=>r.componenteId));

function renderCompList(activoId){
  const comps=DB.componentes.filter(c=>c.activo===activoId);

  return comps.map(c=>{
    const reps=DB.reemplazos.filter(r=>r.componenteId===c.id).sort((x,y)=>(y.fecha||'').localeCompare(x.fecha||''));
    return `<div style="display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:10px 12px">
      <div style="flex:1">${c.codigo?`<span class="code">${esc(c.codigo)}</span> `:''}<b>${esc(c.nombre)}</b> ${(c.cantidad||1)>1?`<span class="pill">x${c.cantidad}</span>`:''} ${c.critico?'<span class="pill pcc">Crítica</span>':''}
        <div class="mini">${esc(c.clasificacion||'Sub equipo')} · ${esc(c.categoria)} · Reemplazada ${reps.length}× · Última: ${reps[0]?fmtDate(reps[0].fecha):'—'}</div></div>

      <button class="btn sm ghost" onclick="delComponente('${c.id}','${activoId}')">Eliminar</button></div>`;
  }).join('');
}
function resetCompForm(){
  COMP_EDIT_ID='';
  $('#c_cod').value='';$('#c_clase').value='Equipo';$('#c_nombre').value='';$('#c_cat').selectedIndex=0;$('#c_cant').value='1';$('#c_crit').value='0';
  $('#compFormTitle').textContent='Agregar pieza';
  $('#compSaveBtn').textContent='+ Agregar pieza';
  $('#compCancelBtn').style.display='none';
}
function editComponente(id,activoId){
  const c=DB.componentes.find(x=>x.id===id);if(!c)return;
  COMP_EDIT_ID=id;
  $('#c_cod').value=c.codigo||'';$('#c_clase').value=c.clasificacion||'Equipo';$('#c_nombre').value=c.nombre;
  $('#c_cat').value=c.categoria;$('#c_cant').value=c.cantidad||1;$('#c_crit').value=c.critico?'1':'0';
  $('#compFormTitle').textContent='Editar pieza';
  $('#compSaveBtn').textContent='Guardar cambios';
  $('#compCancelBtn').style.display='';
}
async function saveComponente(activoId){
  const nombre=$('#c_nombre').value.trim();if(!nombre){toast('Ponle un nombre a la pieza');return;}
  const codigo=$('#c_cod').value.trim().toUpperCase().slice(0,7);
  const cantidad=Math.max(1,+$('#c_cant').value||1);
  const data={activo:activoId,codigo,clasificacion:$('#c_clase').value,nombre,categoria:$('#c_cat').value,cantidad,critico:$('#c_crit').value==='1'};
  const editing=!!COMP_EDIT_ID;
  if(editing){Object.assign(DB.componentes.find(c=>c.id===COMP_EDIT_ID),data);}
  else{DB.componentes.push(Object.assign({id:uid('c_')},data));}
  await save();
  $('#compList').innerHTML=renderCompList(activoId);
  resetCompForm();
  toast(editing?'Pieza actualizada':'Pieza agregada');
}
async function delComponente(id,activoId){
  if(!confirm('¿Eliminar esta pieza? También se borra su historial de reemplazos.'))return;
  DB.componentes=DB.componentes.filter(c=>c.id!==id);
  DB.reemplazos=DB.reemplazos.filter(r=>r.componenteId!==id);
  await save();
  if(COMP_EDIT_ID===id)resetCompForm();
  $('#compList').innerHTML=renderCompList(activoId);
}

      <div class="field"><label>Activo / Equipo</label><select id="h_activo"><option value="">— seleccionar —</option>${actOpts}</select></div>
      <div class="field"><label>Tipo</label><select id="h_tipo">${TIPOS.map(t=>`<option>${t}</option>`).join('')}</select></div></div>
    <div class="field" style="margin-top:13px"><label>Equipo (si no está en la lista)</label><input id="h_eqtxt" placeholder="Opcional"></div>
    <div class="field" style="margin-top:13px"><label>¿Qué encontraste?</label><textarea id="h_desc" placeholder="Ej. fuga de aceite en reductor, ruido anormal, banda floja…"></textarea></div>
    <div class="sectlabel">¿Qué hiciste?</div>
    <div class="seg" id="h_modo" style="width:max-content">
      <button type="button" class="on" data-modo="sitio" onclick="segPick('h_modo',this);hallModo()">✓ Resuelto en sitio</button>
      <button type="button" data-modo="prog" onclick="segPick('h_modo',this);hallModo()">📌 Requiere programación</button></div>
    <div id="h_sitio" style="margin-top:13px">
      <div class="fgrid fg2">
        <div class="field"><label>Técnico</label><select id="h_mec">${mecOpts}</select></div>
        <div class="field"><label>Horas reales</label><input type="number" step="0.5" id="h_hr" value="0.5"></div></div>
      <div class="field" style="margin-top:10px"><label>Acción realizada</label><input id="h_accion" placeholder="Ej. se ajustó tensión y se reengrasó"></div></div>
    <div id="h_prog" style="margin-top:13px;display:none">
      <div class="field"><label>Prioridad sugerida</label><select id="h_prio">${Object.entries(PRIORIDADES).map(([k,v])=>`<option value="${k}" ${k=='3'?'selected':''}>${k}. ${v}</option>`).join('')}</select></div>
      <div class="note" style="margin-top:10px"><span class="ni">ℹ️</span> Se creará una Solicitud pendiente para que el administrador la convierta en OT programada.</div></div>`,
    [{t:'Cancelar',cls:'ghost',fn:'closeModal()'},{t:'Registrar hallazgo',cls:'primary',fn:'saveHallazgo()'}]);
}
function segPick(id,btn){$$('#'+id+' button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
function hallModo(){const modo=$('#h_modo .on').dataset.modo;$('#h_sitio').style.display=modo==='sitio'?'':'none';$('#h_prog').style.display=modo==='prog'?'':'none';}
async function saveHallazgo(){
  const modo=$('#h_modo .on').dataset.modo;
  const actId=$('#h_activo').value;const eqtxt=$('#h_eqtxt').value.trim();const tipo=$('#h_tipo').value;const desc=$('#h_desc').value.trim();
  if(!desc){toast('Describe el hallazgo');return;}
  if(modo==='sitio'){
    const mec=$('#h_mec').value;const hr=+$('#h_hr').value;const accion=$('#h_accion').value.trim();
    const ot={id:uid('o_'),num:nextOtNum(),activo:actId,equipoTxt:eqtxt,clase:'Correctivo',prioridad:2,fechaProg:today(),planificada:false,
      solRef:'',desc:'Hallazgo en inspección: '+desc,mecanico:mec,status:'Terminada',
      tareas:[{t:accion||'Corrección en sitio',done:true}],hrsEst:hr,hrsReal:hr,tiempoMuerto:0,seguridad:true,
      costoMO:0,costoRep:0,costoMisc:0,comentarios:accion,recibeOk:true,origen:'Inspección'};
    if(isBackend()){await apiCall('createOtClosed',{ot});}else{DB.ots.push(ot);await save();}
    closeModal();await refreshData(true);toast('Hallazgo registrado y resuelto · '+ot.num);
  } else {
    const s={id:uid('s_'),num:nextSolNum(),fecha:today(),equipo:actId?(activo(actId).codigo+' '+activo(actId).desc):(eqtxt||'(equipo)'),
      tipo,disponible:today(),prioridad:+$('#h_prio').value,desc:'Hallazgo en inspección: '+desc,
      solicitante:SESSION.role==='mec'?mecanico(SESSION.mecId).nombre:'Administrador',recibe:'',status:'Pendiente',origen:'Inspección'};
    if(isBackend()){await apiCall('createSolicitud',{sol:s});}else{DB.solicitudes.push(s);await save();}
    closeModal();await refreshData(true);toast('Solicitud '+s.num+' creada para programar');
  }
}

/* ============ MODAL + TOAST ============ */
function setModal(title,body,buttons,size){
  $('#mTitle').textContent=title;$('#mBody').innerHTML=body;$('#modal').className='modal'+(size==='lg'?' lg':'');
  $('#mFoot').innerHTML=(buttons||[]).map(b=>`<button class="btn ${b.cls||'ghost'}" onclick="${b.fn}">${b.t}</button>`).join('');
  $('#modalBg').classList.add('show');
}
function closeModal(){$('#modalBg').classList.remove('show');}
$('#modalBg').addEventListener('click',e=>{if(e.target===$('#modalBg'))closeModal();});
function modalOpen(){return $('#modalBg').classList.contains('show');}
let toastT;
function toast(msg){let t=$('#toast');
  if(!t){t=document.createElement('div');t.id='toast';
    t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);color:var(--ink);padding:11px 18px;border-radius:10px;font-weight:600;font-size:13px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transition:.2s';
    document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';t.style.bottom='30px';clearTimeout(toastT);toastT=setTimeout(()=>{t.style.opacity='0';t.style.bottom='24px';},2200);}

/* ============ INIT ============ */
(async function(){
  const slowTimer=setTimeout(()=>{
    const h=document.querySelector('.slow-hint');
    if(h)h.textContent='Esto está tardando más de lo normal — el servidor puede estar arrancando tras un cambio reciente. Espera unos segundos…';
  },6000);
  await loadBackendUrl();
  if(isBackend()){
    try{const d=await apiCall('config');DB.config=d.config;DB.mecanicos=d.mecanicos;}
    catch(e){API.url='';await loadAll();}
  } else { await loadAll(); }
  clearTimeout(slowTimer);
  $('#brandPlant').textContent=DB.config.planta||'Planta';
  renderLogin();
  setInterval(async()=>{if(!SESSION.role||modalOpen())return;const before=JSON.stringify(DB.ots.map(o=>o.id+o.status+o.mecanico));
    try{await loadAll();}catch(e){return;}const after=JSON.stringify(DB.ots.map(o=>o.id+o.status+o.mecanico));if(before!==after)render();},30000);
})();
</script>
